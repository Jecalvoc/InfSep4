<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller de Repaso · Bits, Bytes y Redes</title>
<style>
  :root{
    --morado:#6c4bf6; --morado-claro:#a78bfa;
    --rosa:#ff5f9e; --amarillo:#ffcb3d; --verde:#22c55e; --rojo:#ef4444;
    --azul:#38bdf8; --tinta:#2b2350; --gris:#6b7280;
    --sombra:0 14px 34px rgba(76,56,160,.14);
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:18px 14px 48px;
    font-family:"Trebuchet MS","Segoe UI",Verdana,system-ui,sans-serif;
    color:var(--tinta); min-height:100vh;
    background:
      radial-gradient(900px 520px at 6% 0%, #ffe6f3 0%, transparent 62%),
      radial-gradient(900px 520px at 96% 8%, #e2efff 0%, transparent 62%),
      radial-gradient(900px 620px at 50% 112%, #e6fff1 0%, transparent 62%),
      #f8f6ff;
  }
  .app{max-width:880px;margin:0 auto}
  .top{display:flex;align-items:center;gap:14px;margin:6px 4px 18px}
  .logo{
    width:56px;height:56px;border-radius:20px;display:grid;place-items:center;
    font-size:28px;background:linear-gradient(160deg,#8b6bff,#6c4bf6);
    box-shadow:0 8px 18px rgba(108,75,246,.35); flex:0 0 auto;
  }
  .top h1{margin:0;font-size:22px;letter-spacing:.3px}
  .top p{margin:2px 0 0;font-size:13px;color:var(--gris)}
  .card{
    background:#fff;border-radius:28px;box-shadow:var(--sombra);
    padding:22px; border:1px solid #f0ecff;
  }
  .lead{font-size:16px;line-height:1.55;color:#4a4470;margin:10px 0 0}
  h2{margin:0;font-size:21px}
  h3{margin:10px 0 6px;font-size:17px}
  .acciones{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:22px}
  .btn{
    border:none;border-radius:999px;padding:14px 26px;font-size:16px;font-weight:bold;
    cursor:pointer;font-family:inherit;transition:transform .15s, box-shadow .15s, filter .15s;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{background:linear-gradient(180deg,#8b6bff,#6c4bf6);color:#fff;box-shadow:0 6px 0 #4a2ecb}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 0 #4a2ecb}
  .btn-secondary{background:#fff;color:var(--morado);border:3px solid #ddd4ff;box-shadow:0 6px 0 #ece7ff}
  .btn-secondary:hover{transform:translateY(-2px)}
  .ilus{display:block;width:100%;height:auto;border-radius:20px}
  .hero{max-width:430px;margin:0 auto 6px}
  .inicio{text-align:center}
  .inicio h2{font-size:23px;margin-top:8px}
  .inicio .lead{max-width:560px;margin:12px auto 0}
  .fila{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .chip{
    background:#f1ecff;color:var(--morado);font-size:12px;font-weight:bold;
    padding:6px 12px;border-radius:999px;white-space:nowrap;
  }
  .chip.rosa{background:#fff0f7;color:#be185d}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:16px;margin-top:18px}
  .concepto{
    background:#fff;border-radius:22px;padding:14px;border:3px solid #f1edff;
    box-shadow:0 8px 18px rgba(90,70,180,.08); transition:transform .18s, box-shadow .18s, border-color .18s;
    font-family:inherit;text-align:left;cursor:pointer;color:var(--tinta);
    display:flex;flex-direction:column;width:100%;
  }
  .concepto:hover{transform:translateY(-4px);box-shadow:0 14px 26px rgba(90,70,180,.16);border-color:#c9bcff}
  .concepto-cab{display:flex;align-items:center;gap:8px;margin:10px 0 6px;flex-wrap:wrap}
  .concepto-cab .emoji{font-size:18px}
  .concepto-cab strong{font-size:15px}
  .concepto p{font-size:14px;line-height:1.5;color:#4a4470;margin:0}
  .ver-mas{margin-top:auto;padding-top:12px;font-size:12px;font-weight:bold;color:var(--morado);letter-spacing:.3px}
  .detalle-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .detalle-head h2{margin:0;font-size:22px}
  .detalle-sec{margin-top:20px;padding-top:18px;border-top:2px dashed #ece7ff}
  .detalle-sec h3{margin:0 0 8px;font-size:17px;color:var(--morado);display:flex;align-items:center;gap:8px}
  .detalle-sec h3 .num{
    background:var(--morado);color:#fff;width:26px;height:26px;border-radius:50%;
    display:inline-grid;place-items:center;font-size:13px;flex:0 0 auto;
  }
  .detalle-sec p{margin:8px 0 0;font-size:15px;line-height:1.6;color:#4a4470}
  .detalle-sec .ilus{margin-bottom:12px}
  .caja-dato{
    background:#fffbea;border:3px solid #fde68a;border-radius:18px;
    padding:14px 16px;margin-top:20px;font-size:14.5px;line-height:1.55;color:#7c4a03;
  }
  .caja-dato strong{color:#b45309}
  .caja-clave{
    background:#eefdf4;border:3px solid #86efac;border-radius:18px;
    padding:14px 16px;margin-top:12px;font-size:14.5px;line-height:1.55;color:#065f46;
  }
  .caja-clave strong{color:#15803d}
  .quiz-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .barra{flex:1;height:14px;background:#eee9ff;border-radius:999px;overflow:hidden}
  .barra-fill{
    height:100%;width:0;border-radius:999px;transition:width .45s ease;
    background:linear-gradient(90deg,#a78bfa,#6c4bf6,#ff5f9e);
  }
  .escena{margin:4px 0 16px}
  .pregunta{font-size:19px;line-height:1.4;margin:0 0 16px}
  .opcion{
    display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
    background:#f8f6ff;border:3px solid #e9e3ff;border-radius:18px;
    padding:12px 14px;font-size:15.5px;font-family:inherit;color:var(--tinta);
    cursor:pointer;margin-bottom:10px;transition:all .15s;line-height:1.4;
  }
  .opcion:hover:not(:disabled){background:#efe9ff;border-color:#c9bcff;transform:translateX(4px)}
  .opcion:disabled{cursor:default}
  .opcion .letra{
    flex:0 0 30px;height:30px;border-radius:50%;background:var(--morado);color:#fff;
    display:grid;place-items:center;font-weight:bold;font-size:14px;
  }
  .opcion .txt{flex:1;padding-top:4px}
  .opcion.bien{background:#e9fdf0;border-color:#34d399}
  .opcion.bien .letra{background:var(--verde)}
  .opcion.mal{background:#fef1f2;border-color:#fb7185}
  .opcion.mal .letra{background:var(--rojo)}
  .opcion.apagada{opacity:.55}
  .feedback{
    margin-top:16px;border-radius:20px;padding:14px 16px;font-size:15px;line-height:1.5;
    display:flex;gap:12px;align-items:flex-start;animation:pop .35s ease;
  }
  .feedback .ficon{font-size:26px;line-height:1}
  .feedback.ok{background:#e9fdf0;border:3px solid #6ee7b7}
  .feedback.no{background:#fff1f2;border:3px solid #fda4af}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .final-top{text-align:center}
  .puntaje{
    font-size:52px;font-weight:bold;line-height:1;margin:12px 0 4px;
    background:linear-gradient(180deg,#8b6bff,#ff5f9e);-webkit-background-clip:text;
    background-clip:text;color:transparent;
  }
  .estrellas{font-size:30px;letter-spacing:4px;margin:6px 0 4px}
  .repaso{display:grid;gap:10px;margin-top:20px}
  .repaso-item{
    display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:11px 14px;
    font-size:14.5px;line-height:1.45;
  }
  .repaso-item.ok{background:#eefdf4;border:2px solid #a7f3d0}
  .repaso-item.no{background:#fff1f2;border:2px solid #fecdd3}
  .repaso-item small{color:#5b5578;font-size:13px}
  .marca{font-size:20px;line-height:1.1}
  .repaso-item strong{font-size:15px}
  @media (max-width:520px){
    .card{padding:16px;border-radius:22px}
    .pregunta{font-size:17px}
    .btn{padding:12px 20px;font-size:15px}
    .top h1{font-size:18px}
    .detalle-head h2{font-size:19px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">🌐</div>
    <div>
      <h1>Taller de Repaso</h1>
      <p>Bits, bytes y el mundo de las redes</p>
    </div>
  </header>
  <main id="pantalla"></main>
</div>

  <rect width="400" height="220" rx="22" fill="#fff8e8"/>

    const x = 12 + i*102, final = (i===3);
    return `<rect x="${x}" y="62" width="70" height="56" rx="14" fill="${final?'#ffefc2':'#ffffff'}" stroke="${final?'#b45309':'#f59e0b'}" stroke-width="${final?4:3}"/>

    <text x="${x+35}" y="104" text-anchor="middle" font-size="10" fill="#a16207">${u[1]}</text>`;
  }).join('')}
  ${[0,1,2].map(i=>{
    const ax = 86 + i*102;
    return `<line x1="${ax}" y1="90" x2="${ax+18}" y2="90" stroke="#f59e0b" stroke-width="3"/>

/* =========================================================
   3. ESTADO Y RENDER
   ========================================================= */
const app = document.getElementById('pantalla');
const estado = { pantalla:'inicio', indice:0, respuestas:[], concepto:0 };

function pintar(html){ app.innerHTML = html; }
function irArriba(){ window.scrollTo({ top:0, behavior:'smooth' }); }

function render(){
  if(estado.pantalla === 'inicio')         renderInicio();
  else if(estado.pantalla === 'conceptos') renderConceptos();
  else if(estado.pantalla === 'detalle')   renderDetalle();
  else if(estado.pantalla === 'quiz')      renderQuiz();
  else                                     renderFinal();
}

function renderInicio(){
  pintar(`
    <div class="card inicio">
      <div class="hero">${SVG.hero}</div>
      <h2>¡Hola, explorador de redes! 👋</h2>
      <p class="lead">
        Aquí vas a repasar <strong>bits, bytes, direcciones IP y redes</strong> con dibujos y preguntas.
        Primero toca cada concepto para verlo en detalle, y después juega el reto de
        <strong>10 preguntas</strong>. ¡No hay prisa, se puede repetir las veces que quieras!
      </p>
      <div class="acciones">
        <button class="btn btn-secondary" id="btnConceptos">📚 Ver los conceptos</button>
        <button class="btn btn-primary" id="btnEmpezar">🚀 Empezar el reto</button>
      </div>
    </div>
  `);
  document.getElementById('btnConceptos').onclick = () => { estado.pantalla = 'conceptos'; render(); };
  document.getElementById('btnEmpezar').onclick  = () => empezarReto();
}

function renderConceptos(){
  const cards = ITEMS.map((it, i) => `
    <button class="concepto" data-id="${i}" aria-label="Ver detalle de ${it.titulo}">
      ${it.svg}
      <div class="concepto-cab">
        <span class="emoji">${it.emoji}</span>
        <strong>${it.titulo}</strong>
      </div>
      <p>${it.idea}</p>
      <span class="ver-mas">Ver más →</span>
    </button>`).join('');

  pintar(`
    <div class="card">
      <div class="fila">
        <h2>📚 Conceptos clave</h2>
        <span class="chip">10 ideas · toca para profundizar</span>
      </div>
      <p class="lead">Toca cualquier tarjeta para abrir su ficha completa con más dibujos y ejemplos. ¡Todo lo que está aquí te ayuda a responder el reto!</p>
      <div class="grid">${cards}</div>
      <div class="acciones">
        <button class="btn btn-secondary" id="btnVolver">⬅ Volver</button>
        <button class="btn btn-primary" id="btnAlReto">🚀 ¡Vamos al reto!</button>
      </div>
    </div>
  `);

  document.querySelectorAll('.concepto').forEach(card => {
    card.onclick = () => {
      estado.concepto = Number(card.dataset.id);
      estado.pantalla = 'detalle';
      render();
    };
  });
  document.getElementById('btnVolver').onclick = () => { estado.pantalla = 'inicio'; render(); };
  document.getElementById('btnAlReto').onclick = () => empezarReto();
}

function renderDetalle(){
  const idx = estado.concepto;
  const item = ITEMS[idx];
  const d = item.detalle;
  const total = ITEMS.length;

  const seccionesHTML = d.secciones.map((s, k) => `
    <div class="detalle-sec">
      ${s.svg ? s.svg : ''}
      <h3><span class="num">${k+1}</span>${s.titulo}</h3>
      <p>${s.texto}</p>
    </div>`).join('');

  pintar(`
    <div class="card">
      <div class="detalle-head">
        <span class="chip">Concepto ${idx+1} de ${total}</span>
        <span class="chip rosa">${item.emoji} ${item.titulo}</span>
      </div>
      ${item.svg}
      <h2>${item.emoji} ${item.titulo}</h2>
      <p class="lead">${d.intro}</p>
      ${seccionesHTML}
      <div class="caja-dato">💡 <strong>¿Sabías que…?</strong> ${d.dato}</div>
      <div class="caja-clave">🔑 <strong>Para recordar:</strong> ${d.clave}</div>
      <div class="acciones">
        <button class="btn btn-secondary" id="btnAtras">⬅ Conceptos</button>
        ${idx > 0 ? '<button class="btn btn-secondary" id="btnAnt">◀ Anterior</button>' : ''}
        ${idx < total - 1 ? '<button class="btn btn-secondary" id="btnSig">Siguiente ▶</button>' : ''}
        <button class="btn btn-primary" id="btnAlReto2">🚀 Ir al reto</button>
      </div>
    </div>
  `);

  document.getElementById('btnAtras').onclick = () => { estado.pantalla = 'conceptos'; render(); };
  document.getElementById('btnAlReto2').onclick = () => empezarReto();
  const ant = document.getElementById('btnAnt');
  if(ant) ant.onclick = () => { estado.concepto = idx - 1; render(); };
  const sig = document.getElementById('btnSig');
  if(sig) sig.onclick = () => { estado.concepto = idx + 1; render(); };
  irArriba();
}

function empezarReto(){
  estado.respuestas = new Array(ITEMS.length).fill(undefined);
  estado.indice = 0;
  estado.pantalla = 'quiz';
  render();
  irArriba();
}

function renderQuiz(){
  const i = estado.indice;
  const item = ITEMS[i];
  const resp = estado.respuestas[i];
  const total = ITEMS.length;
  const letras = ['A','B','C','D'];
  const pct = Math.round(((i + (resp ? 1 : 0)) / total) * 100);

  const opcionesHTML = item.opciones.map((op, k) => {
    let cls = 'opcion';
    let dis = '';
    if(resp){
      dis = 'disabled';
      if(k === item.correcta) cls += ' bien';
      else if(k === resp.elegida) cls += ' mal';
      else cls += ' apagada';
    }
    return `<button class="${cls}" data-op="${k}" ${dis}>
        <span class="letra">${letras[k]}</span>
        <span class="txt">${op}</span>
      </button>`;
  }).join('');

  const feedback = resp ? `
    <div class="feedback ${resp.correcta ? 'ok' : 'no'}">
      <div class="ficon">${resp.correcta ? '🎉' : '🤔'}</div>
      <div><strong>${resp.correcta ? '¡Muy bien!' : 'Casi... mira esto:'}</strong><br>${item.explicacion}</div>
    </div>` : '';

  const botonSiguiente = resp ? `
    <div class="acciones">
      <button class="btn btn-primary" id="siguiente">
        ${i === total - 1 ? 'Ver mi resultado 🏁' : 'Siguiente ➜'}
      </button>
    </div>` : '';

  pintar(`
    <div class="card">
      <div class="quiz-top">
        <span class="chip">Pregunta ${i+1} de ${total}</span>
        <div class="barra"><div class="barra-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="escena">${item.svg}</div>
      <h2 class="pregunta">${item.pregunta}</h2>
      <div>${opcionesHTML}</div>
      ${feedback}
      ${botonSiguiente}
    </div>
  `);

  document.querySelectorAll('.opcion').forEach(btn => {
    btn.onclick = () => {
      if(estado.respuestas[estado.indice]) return;
      const k = Number(btn.dataset.op);
      estado.respuestas[estado.indice] = { elegida: k, correcta: (k === item.correcta) };
      render();
    };
  });

  const sig = document.getElementById('siguiente');
  if(sig){
    sig.onclick = () => {
      if(estado.indice < ITEMS.length - 1){
        estado.indice++;
        render();
        irArriba();
      } else {
        estado.pantalla = 'final';
        render();
        irArriba();
      }
    };
  }
}

function renderFinal(){
  const total = ITEMS.length;
  const aciertos = estado.respuestas.filter(r => r && r.correcta).length;
  const estrellasN = Math.max(1, Math.round((aciertos / total) * 5));
  const estrellas = '⭐'.repeat(estrellasN) + '☆'.repeat(5 - estrellasN);

  let mensaje = '';
  if(aciertos === total) mensaje = '¡PERFECTO! Eres un/a experto/a en redes 🌟';
  else if(aciertos >= 8) mensaje = '¡Muy bien! Ya casi lo dominas todo 💪';
  else if(aciertos >= 5) mensaje = '¡Buen trabajo! Repasa los conceptos y vuelve a intentarlo 🙂';
  else mensaje = '¡No te preocupes! Mira otra vez los dibujos y lo vas a lograr 🌱';

  const repaso = ITEMS.map((it, i) => {
    const r = estado.respuestas[i];
    const ok = r && r.correcta;
    return `<div class="repaso-item ${ok ? 'ok' : 'no'}">
      <span class="marca">${ok ? '✅' : '❌'}</span>
      <div>
        <strong>${i+1}. ${it.titulo}</strong><br>
        <small>Respuesta correcta: <em>${it.opciones[it.correcta]}</em></small>
      </div>
    </div>`;
  }).join('');

  pintar(`
    <div class="card">
      <div class="final-top">
        <h2>🏁 ¡Terminaste el reto!</h2>
        <div class="puntaje">${aciertos} / ${total}</div>
        <div class="estrellas">${estrellas}</div>
        <p class="lead">${mensaje}</p>
      </div>
      <div class="repaso">${repaso}</div>
      <div class="acciones">
        <button class="btn btn-secondary" id="btnRepasar">📚 Repasar conceptos</button>
        <button class="btn btn-primary" id="btnRepetir">🔁 Repetir el reto</button>
      </div>
    </div>
  `);
  document.getElementById('btnRepasar').onclick = () => { estado.pantalla = 'conceptos'; render(); irArriba(); };
  document.getElementById('btnRepetir').onclick = () => empezarReto();
}

render();
</script>
</body>
</html>
